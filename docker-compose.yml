# 只运行静态 web 服务：先在 node 镜像里构建，再用 nginx 托管 dist。
# 宿主端口可用 APP_PORT 覆盖：
#   APP_PORT=9000 docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pull-story-cards-web
    container_name: pull-story-cards-web
    ports:
      # 默认 8080，可用 APP_PORT 覆盖宿主侧端口
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
