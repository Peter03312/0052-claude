server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 单页应用：任何路径都回到 index.html（本应用实际只有一个页面）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源加一点缓存；index.html 不缓存，方便更新
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
